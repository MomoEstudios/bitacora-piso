<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bitácora Piso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1117;--surface:#1c1f2b;--surface2:#252836;--border:#2e3248;
  --gold:#e8b800;--red:#c0392b;--green:#27ae60;--blue:#2980b9;--orange:#e67e22;
  --text:#f0f0f0;--text2:#9a9db5;--text3:#5a5d7a;
  --safe-bottom:env(safe-area-inset-bottom,0px)
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}

/* SCREENS */
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex}

/* TOP BAR */
.topbar{display:flex;align-items:center;gap:10px;padding:52px 16px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar h1{font-size:18px;font-weight:700;flex:1}
.topbar .sub{font-size:12px;color:var(--text2);margin-top:2px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text2);cursor:pointer;flex-shrink:0}

/* SCROLLABLE BODY */
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 120px}

/* HOME — UNIT CARDS */
.unit-card{margin:12px 14px 0;background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden;cursor:pointer;active:scale(.98)}
.unit-card:active{opacity:.85}
.unit-card .uc-head{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:12px}
.unit-tag{min-width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--surface2)}
.uc-info{flex:1}
.uc-info h2{font-size:15px;font-weight:700}
.uc-info .uc-sub{font-size:12px;color:var(--text2);margin-top:2px}
.uc-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;align-self:flex-start;white-space:nowrap}
.badge-prod{background:rgba(39,174,96,.15);color:#27ae60;border:1px solid rgba(39,174,96,.3)}
.badge-rep{background:rgba(230,126,34,.15);color:#e67e22;border:1px solid rgba(230,126,34,.3)}
.uc-progress{padding:0 16px 14px}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:5px}
.prog-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:var(--gold);transition:width .3s}
.uc-footer{padding:8px 16px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.uc-footer .last{font-size:11px;color:var(--text3);flex:1}
.uc-footer .alert{font-size:11px;font-weight:600;color:var(--red)}
.uc-footer .ok{font-size:11px;font-weight:600;color:var(--green)}

/* ADD UNIT BTN */
.add-unit-btn{margin:12px 14px 4px;padding:14px;background:var(--surface2);border:1px dashed var(--border);border-radius:14px;text-align:center;color:var(--text2);font-size:14px;cursor:pointer}
.add-unit-btn:active{opacity:.7}

/* SECTION HEADER */
.sec-header{padding:18px 16px 6px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}

/* UNIT DETAIL */
.stage-bar{margin:14px;background:var(--surface);border-radius:12px;padding:14px;border:1px solid var(--border)}
.stage-label{font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.stage-name{font-size:16px;font-weight:700;color:var(--gold);margin-bottom:10px}
.stage-dots{display:flex;gap:5px;flex-wrap:wrap}
.stage-dot{height:6px;flex:1;border-radius:3px;background:var(--border)}
.stage-dot.done{background:var(--gold)}
.stage-dot.current{background:var(--gold);opacity:.5}

/* FEED */
.feed-entry{margin:0 14px 10px;background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.feed-entry.type-photo .fe-img{width:100%;max-height:220px;object-fit:cover;display:block}
.fe-body{padding:10px 12px}
.fe-meta{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.fe-type-icon{font-size:13px}
.fe-time{font-size:11px;color:var(--text3);flex:1}
.fe-stage-tag{font-size:10px;color:var(--text2);background:var(--surface2);padding:2px 7px;border-radius:10px}
.fe-text{font-size:14px;line-height:1.5;color:var(--text)}
.fe-material{display:flex;align-items:center;gap:10px;padding:10px 12px}
.fe-mat-icon{font-size:22px}
.fe-mat-info{flex:1}
.fe-mat-name{font-size:14px;font-weight:600}
.fe-mat-status{font-size:12px;margin-top:2px;font-weight:600}
.status-pending{color:var(--red)}.status-transit{color:var(--orange)}.status-received{color:var(--green)}
.fe-mat-update{font-size:11px;color:var(--text2);margin-top:2px}
.fe-mat-btn{font-size:11px;padding:5px 10px;border-radius:8px;border:none;background:var(--surface2);color:var(--text2);cursor:pointer;border:1px solid var(--border)}
.fe-mat-btn:active{opacity:.7}

/* ACTION BAR */
.action-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 14px;padding-bottom:calc(10px + var(--safe-bottom));display:none;gap:10px}
.action-bar.visible{display:flex}
.act-btn{flex:1;padding:14px 8px;border-radius:12px;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.3px}
.act-btn:active{opacity:.7;transform:scale(.97)}
.act-btn .icon{font-size:22px}
.btn-photo{background:rgba(232,184,0,.12);color:var(--gold);border:1px solid rgba(232,184,0,.25)}
.btn-note{background:rgba(41,128,185,.12);color:#4fa3e0;border:1px solid rgba(41,128,185,.25)}
.btn-material{background:rgba(192,57,43,.12);color:#e06b5f;border:1px solid rgba(192,57,43,.25)}
.btn-stage{background:rgba(39,174,96,.12);color:#4ec87a;border:1px solid rgba(39,174,96,.25)}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:16px;padding-bottom:calc(16px + var(--safe-bottom))}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal h2{font-size:17px;font-weight:700;margin-bottom:14px}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:15px;resize:none;font-family:inherit;outline:none;-webkit-appearance:none}
.modal-input:focus{border-color:var(--gold)}
.modal-btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.modal-btn.primary{background:var(--gold);color:#000}
.modal-btn.cancel{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.modal-btn:active{opacity:.8}

/* MATERIAL SELECTION */
.mat-list{margin:8px 0}
.mat-item{padding:13px 14px;border-radius:10px;background:var(--surface2);margin-bottom:6px;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;gap:10px}
.mat-item:active{opacity:.8}
.mat-item.selected{border-color:var(--gold)}
.mat-item .mat-icon{font-size:20px}
.mat-item .mat-name{font-size:14px;font-weight:600;flex:1}
.mat-item .mat-check{font-size:18px;opacity:0}
.mat-item.selected .mat-check{opacity:1;color:var(--gold)}
.status-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 14px}
.status-opt{padding:12px 6px;border-radius:10px;border:2px solid var(--border);text-align:center;cursor:pointer;font-size:12px;font-weight:700}
.status-opt:active{opacity:.8}
.status-opt.sel-pending{border-color:var(--red);background:rgba(192,57,43,.12);color:var(--red)}
.status-opt.sel-transit{border-color:var(--orange);background:rgba(230,126,34,.12);color:var(--orange)}
.status-opt.sel-received{border-color:var(--green);background:rgba(39,174,96,.12);color:var(--green)}

/* STAGE SELECT */
.stage-list .stage-item{padding:14px;border-radius:10px;background:var(--surface2);margin-bottom:6px;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;gap:12px}
.stage-item:active{opacity:.8}
.stage-item.done-item{opacity:.5}
.stage-item.current-item{border-color:var(--gold)}
.stage-item .si-num{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);flex-shrink:0}
.stage-item.current-item .si-num{background:var(--gold);color:#000}
.stage-item.done-item .si-num{background:var(--green);color:#fff}
.stage-item .si-name{font-size:14px;font-weight:600}

/* ADD UNIT FORM */
.form-group{margin-bottom:14px}
.form-group label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
.form-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:15px;-webkit-appearance:none;outline:none}
.form-select:focus{border-color:var(--gold)}
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.model-opt{padding:12px;border-radius:10px;background:var(--surface2);border:2px solid var(--border);text-align:center;cursor:pointer}
.model-opt:active{opacity:.8}
.model-opt.selected{border-color:var(--gold)}
.model-opt .mo-name{font-size:14px;font-weight:700}
.model-opt .mo-sub{font-size:11px;color:var(--text2);margin-top:2px}
.type-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0}
.type-opt{padding:14px;border-radius:10px;background:var(--surface2);border:2px solid var(--border);text-align:center;cursor:pointer}
.type-opt.selected{border-color:var(--gold)}
.type-opt .to-icon{font-size:24px;display:block;margin-bottom:4px}
.type-opt .to-name{font-size:13px;font-weight:700}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.empty .ei{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px;line-height:1.6}

/* FILE INPUT HIDDEN */
#cameraInput{display:none}
</style>
</head>
<body>

<!-- ══════════════════ SCREEN: HOME ══════════════════ -->
<div class="screen active" id="screen-home">
  <div class="topbar">
    <div style="flex:1">
      <h1>Bitácora Piso</h1>
      <div class="sub" id="home-date"></div>
    </div>
    <div onclick="manualSync()" style="width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer" title="Sincronizar">⟳</div>
  <div style="width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#000">A</div>
  </div>
  <div class="scroll-body" id="home-list">
    <!-- generated -->
  </div>
</div>

<!-- ══════════════════ SCREEN: UNIT DETAIL ══════════════════ -->
<div class="screen" id="screen-unit">
  <div class="topbar">
    <div class="back-btn" onclick="goHome()">‹</div>
    <div style="flex:1">
      <h1 id="unit-title">Unidad</h1>
      <div class="sub" id="unit-sub"></div>
    </div>
  </div>
  <div class="scroll-body" id="unit-feed">
    <!-- generated -->
  </div>
  <div class="action-bar visible" id="unit-actions">
    <button class="act-btn btn-photo" onclick="triggerCamera()">
      <span class="icon">📷</span>FOTO
    </button>
    <button class="act-btn btn-note" onclick="openNoteModal()">
      <span class="icon">📝</span>NOTA
    </button>
    <button class="act-btn btn-material" onclick="openMaterialModal()">
      <span class="icon">⚠️</span>MATERIAL
    </button>
    <button class="act-btn btn-stage" onclick="openStageModal()">
      <span class="icon">✅</span>ETAPA
    </button>
  </div>
</div>

<!-- HIDDEN CAMERA INPUT -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhoto(event)">

<!-- ══════════════════ MODAL: NOTA ══════════════════ -->
<div class="modal-overlay" id="modal-note" onclick="closeModal('modal-note')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2>📝 Agregar Nota</h2>
    <textarea class="modal-input" id="note-text" rows="5" placeholder="Describe el avance, problema o observación..."></textarea>
    <button class="modal-btn primary" onclick="saveNote()">Guardar Nota</button>
    <button class="modal-btn cancel" onclick="closeModal('modal-note')">Cancelar</button>
  </div>
</div>

<!-- ══════════════════ MODAL: MATERIAL ══════════════════ -->
<div class="modal-overlay" id="modal-material" onclick="closeModal('modal-material')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2>⚠️ Reporte de Material</h2>
    <div class="form-group">
      <label>Material</label>
      <div class="mat-list" id="mat-list"></div>
      <input class="modal-input" id="mat-custom" placeholder="Otro material (escribe aquí)..." style="margin-top:6px">
    </div>
    <div class="form-group">
      <label>Estado actual</label>
      <div class="status-opts">
        <div class="status-opt" id="sopt-pending" onclick="selectStatus('pending')">🔴<br>Sin comprar</div>
        <div class="status-opt" id="sopt-transit" onclick="selectStatus('transit')">🟡<br>En tránsito</div>
        <div class="status-opt" id="sopt-received" onclick="selectStatus('received')">🟢<br>Recibido</div>
      </div>
    </div>
    <textarea class="modal-input" id="mat-note" rows="2" placeholder="Nota adicional (opcional)..."></textarea>
    <button class="modal-btn primary" onclick="saveMaterial()">Guardar</button>
    <button class="modal-btn cancel" onclick="closeModal('modal-material')">Cancelar</button>
  </div>
</div>

<!-- ══════════════════ MODAL: STAGE ══════════════════ -->
<div class="modal-overlay" id="modal-stage" onclick="closeModal('modal-stage')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2>✅ Avanzar Etapa</h2>
    <div class="stage-list" id="stage-list"></div>
    <button class="modal-btn cancel" onclick="closeModal('modal-stage')">Cancelar</button>
  </div>
</div>

<!-- ══════════════════ MODAL: ADD UNIT ══════════════════ -->
<div class="modal-overlay" id="modal-addunit" onclick="closeModal('modal-addunit')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2>➕ Nueva Unidad</h2>
    <div class="form-group">
      <label>Tipo</label>
      <div class="type-opts">
        <div class="type-opt selected" id="topt-prod" onclick="selectType('prod')">
          <span class="to-icon">🏗️</span><span class="to-name">Producción Nueva</span>
        </div>
        <div class="type-opt" id="topt-rep" onclick="selectType('rep')">
          <span class="to-icon">🔧</span><span class="to-name">Reparación / Mod</span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Modelo</label>
      <div class="model-grid" id="model-grid"></div>
    </div>
    <div class="form-group">
      <label>Número de unidad / folio</label>
      <input class="modal-input" id="unit-num" placeholder="Ej: #007, REM-2024-05..." style="display:block">
    </div>
    <div class="form-group" id="rep-reason-group" style="display:none">
      <label>Motivo de reparación</label>
      <input class="modal-input" id="rep-reason" placeholder="Ej: Piso dañado, cambio de eje..." style="display:block">
    </div>
    <div class="form-group" id="rep-deadline-group" style="display:none">
      <label>Fecha compromiso de entrega</label>
      <input class="modal-input" id="rep-deadline" type="date" style="display:block">
    </div>
    <button class="modal-btn primary" onclick="saveNewUnit()">Crear Unidad</button>
    <button class="modal-btn cancel" onclick="closeModal('modal-addunit')">Cancelar</button>
  </div>
</div>

<!-- ══════════════════ MODAL: UPDATE MATERIAL STATUS ══════════════════ -->
<div class="modal-overlay" id="modal-matupdate" onclick="closeModal('modal-matupdate')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2 id="matupdate-title">Actualizar Material</h2>
    <div class="form-group">
      <label>Nuevo estado</label>
      <div class="status-opts">
        <div class="status-opt" id="uopt-pending" onclick="selectUpdateStatus('pending')">🔴<br>Sin comprar</div>
        <div class="status-opt" id="uopt-transit" onclick="selectUpdateStatus('transit')">🟡<br>En tránsito</div>
        <div class="status-opt" id="uopt-received" onclick="selectUpdateStatus('received')">🟢<br>Recibido</div>
      </div>
    </div>
    <textarea class="modal-input" id="matupdate-note" rows="2" placeholder="Nota de actualización (opcional)..."></textarea>
    <button class="modal-btn primary" onclick="saveMatUpdate()">Actualizar</button>
    <button class="modal-btn cancel" onclick="closeModal('modal-matupdate')">Cancelar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

// ── LOCAL STORAGE (primario) ──────────────────────────────────────────────────

function saveLocal() {

}

function loadLocal() {

  return false;
}

// ── SUPABASE SYNC (secundario, en background) ─────────────────────────────────

let supaOnline = false;

async function pingSupabase() {
  try {
    const { error } = await Promise.race([
      db.from('units').select('id').limit(1),
      new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 5000))
    ]);
    supaOnline = !error;
  } catch { supaOnline = false; }
  setConnStatus(supaOnline, supaOnline ? '☁ Nube activa' : '📱 Solo local');
}

async function syncToSupabase() {
  if (!supaOnline) return;
  try {
    for (const u of units) {
      const row = {
        id: u.id, type: u.type, model: u.model, num: u.num,
        stage_idx: u.stageIdx,
        rep_reason: u.repReason || null,
        rep_deadline: u.repDeadline || null,
      };
      await db.from('units').upsert(row);
      for (const e of u.entries) {
        let photoUrl = e.dataUrl || null;
        if (e.type === 'photo' && e.dataUrl && e.dataUrl.startsWith('data:')) {
          const blob = await (await fetch(e.dataUrl)).blob();
          const ext = blob.type.includes('png') ? 'png' : 'jpg';
          const path = `${u.id}/${e.id}.${ext}`;
          const { error: upErr } = await db.storage.from('photos').upload(path, blob, {contentType: blob.type, upsert: true});
          if (!upErr) {
            const { data } = db.storage.from('photos').getPublicUrl(path);
            photoUrl = data.publicUrl;
          }
        }
        const erow = {
          id: e.id, unit_id: u.id, type: e.type,
          text: e.text || null, stage: e.stage || null,
          mat_id: e.matId || null, mat_name: e.matName || null,
          status: e.status || null, note: e.note || null,
          photo_url: photoUrl,
        };
        await db.from('entries').upsert(erow);
      }
    }
    setConnStatus(true, '☁ Sincronizado');
  } catch(err) {
    console.error('Sync error:', err);
    setConnStatus(false, '📱 Solo local');
  }
}

async function loadFromDB() {
  showLoading(true);
  setConnStatus(null, '⟳ Cargando...');

  // Carga local inmediata
  loadLocal();
  renderHome();

  // Intenta Supabase en background
  await pingSupabase();
  if (supaOnline) {
    try {
      const { data: dbUnits } = await db.from('units').select('*').order('created_at', {ascending:true});
      const { data: dbEntries } = await db.from('entries').select('*').order('created_at', {ascending:true});
      if (dbUnits && dbUnits.length > 0) {
        units = dbUnits.map(u => ({
          id: u.id, type: u.type, model: u.model, num: u.num,
          stageIdx: u.stage_idx || 0,
          repReason: u.rep_reason, repDeadline: u.rep_deadline,
          createdAt: new Date(u.created_at).getTime(),
          entries: (dbEntries || [])
            .filter(e => e.unit_id === u.id)
            .map(e => ({
              id: e.id, type: e.type, text: e.text, stage: e.stage,
              matId: e.mat_id, matName: e.mat_name, status: e.status,
              note: e.note, dataUrl: e.photo_url,
              ts: new Date(e.created_at).getTime()
            }))
        }));
        saveLocal();
        renderHome();
        setConnStatus(true, '☁ Sincronizado');
      } else {
        // Supabase vacío — sube datos locales
        await syncToSupabase();
      }
    } catch(err) {
      console.error(err);
      setConnStatus(false, '📱 Solo local');
    }
  }
  showLoading(false);
}

async function saveUnit(u) {
  saveLocal();
  if (supaOnline) {
    const row = {
      id: u.id, type: u.type, model: u.model, num: u.num,
      stage_idx: u.stageIdx,
      rep_reason: u.repReason || null,
      rep_deadline: u.repDeadline || null,
    };
    const { error } = await db.from('units').upsert(row);
    if (error) { supaOnline = false; setConnStatus(false, '📱 Solo local'); }
  }
}

async function saveEntry(unitId, e) {
  saveLocal();
  if (!supaOnline) return;
  let photoUrl = e.dataUrl || null;
  if (e.type === 'photo' && e.dataUrl && e.dataUrl.startsWith('data:')) {
    try {
      const blob = await (await fetch(e.dataUrl)).blob();
      const ext = blob.type.includes('png') ? 'png' : 'jpg';
      const path = `${unitId}/${e.id}.${ext}`;
      const { error: upErr } = await db.storage.from('photos').upload(path, blob, {contentType: blob.type, upsert: true});
      if (!upErr) {
        const { data } = db.storage.from('photos').getPublicUrl(path);
        photoUrl = data.publicUrl;
      }
    } catch(err) { console.error('Photo upload:', err); }
  }
  const row = {
    id: e.id, unit_id: unitId, type: e.type,
    text: e.text || null, stage: e.stage || null,
    mat_id: e.matId || null, mat_name: e.matName || null,
    status: e.status || null, note: e.note || null,
    photo_url: photoUrl,
  };
  const { error } = await db.from('entries').upsert(row);
  if (error) { supaOnline = false; setConnStatus(false, '📱 Solo local'); }
}

async function updateEntryStatus(entryId, status, note) {
  saveLocal();
  if (!supaOnline) return;
  const { error } = await db.from('entries').update({status, note: note||null}).eq('id', entryId);
  if (error) { supaOnline = false; }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────

function uid() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}

function fmtTime(ts) {
  const d = new Date(ts);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  const hm = d.toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'});
  if (isToday) return `Hoy ${hm}`;
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'}) + ` ${hm}`;
}

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

function getStages(unit) { return unit.type === 'rep' ? STAGES_REP : STAGES_PROD; }

function stageLabel(unit) {
  const s = getStages(unit);
  return s[unit.stageIdx] || 'Completado';
}

function stagePct(unit) {
  const s = getStages(unit);
  return Math.round((unit.stageIdx / (s.length - 1)) * 100);
}

function lastEntry(unit) {
  if (!unit.entries.length) return null;
  return unit.entries[unit.entries.length - 1];
}

function statusLabel(s) {
  if (s === 'pending') return {txt:'Sin comprar', cls:'status-pending'};
  if (s === 'transit') return {txt:'En tránsito', cls:'status-transit'};
  return {txt:'Recibido ✓', cls:'status-received'};
}

function getUnit(id) { return units.find(u => u.id === id); }

// ── HOME ──────────────────────────────────────────────────────────────────────

function renderHome() {
  document.getElementById('home-date').textContent = fmtDate(Date.now());

  const prod = units.filter(u => u.type === 'prod');
  const rep  = units.filter(u => u.type === 'rep');
  let html = '';

  if (prod.length) {
    html += `<div class="sec-header">Producción nueva (${prod.length})</div>`;
    prod.forEach(u => html += unitCard(u));
  }
  if (rep.length) {
    html += `<div class="sec-header">Reparación / modificación (${rep.length})</div>`;
    rep.forEach(u => html += unitCard(u));
  }
  if (!units.length) {
    html += `<div class="empty"><div class="ei">🏗️</div><p>No hay unidades registradas.<br>Agrega la primera unidad en piso.</p></div>`;
  }

  html += `<div class="add-unit-btn" onclick="openAddUnit()">+ Registrar unidad</div>`;
  html += `<div style="height:20px"></div>`;

  document.getElementById('home-list').innerHTML = html;
}

function unitCard(u) {
  const pct = stagePct(u);
  const le = lastEntry(u);
  const ago = le ? fmtTime(le.ts) : 'Sin entradas';
  const hasAlert = u.entries.some(e => e.type==='material' && e.status==='pending');
  const badgeCls = u.type === 'prod' ? 'badge-prod' : 'badge-rep';
  const badgeTxt = u.type === 'prod' ? 'Producción' : 'Reparación';
  const modelObj = MODELS.find(m => m.id === u.model) || {name: u.model};
  return `
  <div class="unit-card" onclick="openUnit('${u.id}')">
    <div class="uc-head">
      <div class="unit-tag">${u.type==='rep'?'🔧':'🏗️'}</div>
      <div class="uc-info">
        <h2>${modelObj.name} ${u.num}</h2>
        <div class="uc-sub">${modelObj.sub||''} · ${stageLabel(u)}</div>
      </div>
      <span class="uc-badge ${badgeCls}">${badgeTxt}</span>
    </div>
    <div class="uc-progress">
      <div class="prog-labels"><span>${stageLabel(u)}</span><span>${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="uc-footer">
      <span class="last">Última entrada: ${ago}</span>
      ${hasAlert ? '<span class="alert">⚠ Material pendiente</span>' : '<span class="ok">✓ Sin alertas</span>'}
    </div>
  </div>`;
}

// ── UNIT DETAIL ───────────────────────────────────────────────────────────────

function openUnit(id) {
  activeUnitId = id;
  const u = getUnit(id);
  const modelObj = MODELS.find(m => m.id === u.model) || {name:u.model,sub:''};
  document.getElementById('unit-title').textContent = `${modelObj.name} ${u.num}`;
  document.getElementById('unit-sub').textContent = u.type === 'rep'
    ? `Reparación · ${u.repReason || ''}`
    : `Producción · ${modelObj.sub}`;
  renderUnitFeed();
  showScreen('screen-unit');
}

function renderUnitFeed() {
  const u = getUnit(activeUnitId);
  const stages = getStages(u);
  const pct = stagePct(u);
  const dots = stages.map((s,i) =>
    `<div class="stage-dot ${i < u.stageIdx ? 'done' : i === u.stageIdx ? 'current' : ''}"></div>`
  ).join('');

  let html = `
  <div class="stage-bar">
    <div class="stage-label">Etapa actual · ${pct}% completado</div>
    <div class="stage-name">${stageLabel(u)}</div>
    <div class="stage-dots">${dots}</div>
  </div>`;

  if (u.type === 'rep' && u.repDeadline) {
    html += `<div style="margin:0 14px 10px;padding:10px 14px;background:rgba(230,126,34,.1);border-radius:10px;border:1px solid rgba(230,126,34,.25);font-size:12px;color:#e67e22"><strong>Entrega comprometida:</strong> ${u.repDeadline}</div>`;
  }

  if (!u.entries.length) {
    html += `<div class="empty"><div class="ei">📋</div><p>Sin entradas aún.<br>Usa los botones de abajo para agregar fotos, notas o reportar materiales.</p></div>`;
  } else {
    // group by date
    const byDate = {};
    [...u.entries].reverse().forEach(e => {
      const dk = new Date(e.ts).toDateString();
      if (!byDate[dk]) byDate[dk] = [];
      byDate[dk].push(e);
    });
    Object.entries(byDate).forEach(([dk, entries]) => {
      const d = new Date(dk);
      const label = d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
      html += `<div class="sec-header">${label}</div>`;
      entries.forEach(e => { html += entryHtml(e); });
    });
  }

  document.getElementById('unit-feed').innerHTML = html;
}

function entryHtml(e) {
  const timeTag = `<span class="fe-time">${fmtTime(e.ts)}</span>`;
  const stageTag = e.stage ? `<span class="fe-stage-tag">${e.stage}</span>` : '';

  if (e.type === 'photo') {
    return `<div class="feed-entry type-photo">
      <img class="fe-img" src="${e.dataUrl}" alt="foto">
      <div class="fe-body">
        <div class="fe-meta"><span class="fe-type-icon">📷</span>${timeTag}${stageTag}</div>
        ${e.caption ? `<div class="fe-text">${e.caption}</div>` : ''}
      </div>
    </div>`;
  }

  if (e.type === 'note') {
    return `<div class="feed-entry">
      <div class="fe-body">
        <div class="fe-meta"><span class="fe-type-icon">📝</span>${timeTag}${stageTag}</div>
        <div class="fe-text">${e.text}</div>
      </div>
    </div>`;
  }

  if (e.type === 'material') {
    const sl = statusLabel(e.status);
    return `<div class="feed-entry">
      <div class="fe-material">
        <div class="fe-mat-icon">⚠️</div>
        <div class="fe-mat-info">
          <div class="fe-mat-name">${e.matName}</div>
          <div class="fe-mat-status ${sl.cls}">${sl.txt}</div>
          ${e.note ? `<div class="fe-mat-update">${e.note}</div>` : ''}
          <div class="fe-mat-update">${fmtTime(e.ts)} · ${e.stage||''}</div>
        </div>
        <button class="fe-mat-btn" onclick="openMatUpdate('${e.id}')">Actualizar</button>
      </div>
    </div>`;
  }

  if (e.type === 'stage') {
    return `<div class="feed-entry">
      <div class="fe-body">
        <div class="fe-meta"><span class="fe-type-icon">✅</span>${timeTag}</div>
        <div class="fe-text" style="color:var(--green);font-weight:600">${e.text}</div>
      </div>
    </div>`;
  }
  return '';
}

// ── PHOTO HANDLER (Supabase) ──────────────────────────────────────────────────

function compressImage(file, maxWidth=1200, quality=0.75) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = url;
  });
}

function handlePhoto(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  showToast('Procesando foto...');
  compressImage(file).then(async dataUrl => {
    const u = getUnit(activeUnitId);
    const entry = {
      id: uid(), type:'photo', dataUrl,
      caption:'', ts: Date.now(), stage: stageLabel(u)
    };
    u.entries.push(entry);
    renderUnitFeed(); renderHome();
    await saveEntry(u.id, entry);
    showToast('Foto guardada en la nube');
  });
  evt.target.value = '';
}

async function manualSync() {
  showToast('Sincronizando...');
  await pingSupabase();
  if (supaOnline) {
    await syncToSupabase();
    showToast('✓ Datos sincronizados con la nube');
  } else {
    showToast('Sin conexión a la nube — datos guardados localmente');
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────

loadFromDB();
</script>
